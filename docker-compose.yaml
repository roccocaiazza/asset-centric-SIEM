services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=siem-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=asset-siem
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:asset-siem http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Imposta la password di kibana_system al primo avvio
  setup:
    image: curlimages/curl:8.7.1
    container_name: es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: "no"
    command:
      - "-s"
      - "-X"
      - "POST"
      - "-u"
      - "elastic:asset-siem"
      - "http://elasticsearch:9200/_security/user/kibana_system/_password"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - '{"password":"asset-siem"}'

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a1b2c3d4e5f67h8i9j0k1l2m3n4o5p6q7r8s9t0A
      - XPACK_SECURITY_ENCRYPTIONKEY=z9y8x7w6v5u4t3s2r1q0p9o8n7m6l5k4j3i2h1g0B
      - XPACK_REPORTING_ENCRYPTIONKEY=1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0C
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=asset-siem
    ports:
      - "5601:5601"
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - elastic

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"   # Filebeat input
      - "5000:5000"   # Syslog input
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic

volumes:
  esdata:

networks:
  elastic:
    driver: bridge